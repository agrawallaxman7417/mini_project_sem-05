<!DOCTYPE html>
<html lang="en">    
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <title>Event Yatra - Home Page</title>
</head>
    <body>
        <header class="header">
            <img src="resources/logo.png" alt="Event Yatra Logo" class="logo">
            <nav class="nav-bar">
                <ul class="nav-links">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Events</a></li>
                    <li><a href="#">About</a></li>
                </ul>
            </nav>
            <button id="profile-button">👤</button>
        </header>
        <main class="main-content">
            <section class="hero-section" aria-labelledby="hero-title">
                <div class="hero-glow hero-glow-left" aria-hidden="true"></div>
                <div class="hero-glow hero-glow-right" aria-hidden="true"></div>

                <div class="hero-content">
                    <div class="hero-eyebrow">
                        <span class="eyebrow-dot" aria-hidden="true"></span>
                        India's Premier Ticketing Gateway
                    </div>

                    <h1 id="hero-title">India's Events.<br>
                        <span>Your Next Experience.</span>
                    </h1>

                    <p id="hero-description">
                        From live concerts and college fests to tech conferences,
                        sports and cultural celebrations — discover what's happening
                        across India.
                    </p>
                </div>

                <div class="image-container">
                    <div class="hero-image-frame">
                        <img class="hero-image" src="resources/hero-section-concert.jpg" alt="Crowd enjoying a live concert">
                        <div class="image-gradient" aria-hidden="true"></div>
                        <div class="event-stat-card">
                            <div class="ticket-icon" aria-hidden="true">▣</div>
                            <div class="event-stat-copy">
                                <strong>1,850+ Verified Events</strong>
                                <span>Live booking across 15+ cities</span>
                            </div>
                            <span class="live-indicator" aria-label="Live"></span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

    </body>
</html>
